name: probe-fund-holdings
on:
  workflow_dispatch:
concurrency:
  group: conviction-board-writes   # one run at a time: overlapping runs were merging half of one run's data into another's
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-refresh.txt
      - run: python fund_probe.py
      - name: Fresh fund returns and benchmark files for an offline check (kept on the side branch only)
        run: |
          mkdir -p probe_pages
          python -c "import refresh, shutil, datetime as d; t=d.date.today(); refresh.refresh_fund_returns(t); refresh.refresh_benchmarks(t); shutil.copy('data_web/returns.csv','probe_pages/returns.csv'); shutil.copy('data_web/benchmarks.csv','probe_pages/benchmarks.csv')" || true
          git checkout -- data_web || true
      - name: Save the report (no rankings change)
        run: |
          git config user.name "conviction-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/fund_probe.json data/fund_probe.txt
          git diff --cached --quiet && exit 0
          git commit -m "fund holdings probe $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && exit 0; sleep 10; done
      - name: Keep issuer pages on a side branch (not main)
        run: |
          git config user.name "conviction-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan probe-pages && git rm -rqf --cached . && git add probe_pages && git commit -qm "probe pages" && git push -f origin probe-pages
          